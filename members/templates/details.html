{% extends "master.html" %} 


<!DOCTYPE html> 
<html>
<body> 
    <!-- The code on line 1 must be the first tag on the code. Hence it's at the top and the commented code below(which was meant to be at the top) -->

    {% block title %} Details about {{ mymember.firstname }} {{ mymember.lastname }} {% endblock %} 
    {% block content %} 
    <div class="mycard"> 
        <h1>{{ mymember.firstname }} {{ mymember.lastname }}</h1> 
        <p>Phone {{ mymember.phone }}</p>
        <p>Member since: {{ mymember.joined_date }}</p> 
    </div> 
    {% endblock %} 

</body> 
</html>
